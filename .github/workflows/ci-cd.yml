name: CI / CD für Managed WordPress

# Auslösen bei jedem Push auf den Hauptbranch und bei Pull‑Requests
on:
  push:
    branches: [ main ]            # ggf. deinen Branch‑Namen einsetzen
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------
  # 1️⃣ Build – nur nötig, wenn du Assets (SCSS, JS) erzeugst
  # -------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Node (falls du npm‑Build‑Tools nutzt) ----
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'      # oder die von dir gewünschte Version

      - name: Install npm dependencies
        run: npm ci               # nutzt package-lock.json

      - name: Build assets (z. B. gulp / webpack)
        run: npm run build        # definiere das Script in package.json

      # ---- PHP‑Composer (falls du PHP‑Abhängigkeiten hast) ----
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, zip

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist

      # (Optional) Artefakte für Debug‑Zwecke speichern
      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-artifact
          path: |
            wp-content/themes/my-theme
            wp-content/plugins/my-plugin
            vendor/
            node_modules/

  # -------------------------------------------------
  # 2️⃣ Deploy – läuft nur, wenn der Build erfolgreich war
  # -------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      WP_PATH:    ${{ secrets.WP_PATH }}

    steps:
      - name: Checkout repository (again)
        uses: actions/checkout@v4

      # ---- SSH‑Key in die Runner‑Umgebung legen ----
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Host‑Key im known_hosts‑File speichern (um man‑in‑the‑middle‑Attacken zu verhindern)
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      # ---- Code per rsync auf den Server kopieren ----
      - name: Deploy wp-content via rsync
        env:
          RSYNC_RSH: "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes"
        run: |
          rsync -avz --delete \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.git*' \
            --exclude='*.map' \
            ./wp-content/ "${DEPLOY_USER}@${DEPLOY_HOST}:${WP_PATH}/wp-content/"

      # ---- Nach‑Deploy WP‑CLI‑Befehle ausführen ----
      - name: Run WP‑CLI post‑deploy commands
        env:
          SSH_CMD: "ssh -i ~/.ssh/id_ed25519 ${DEPLOY_USER}@${DEPLOY_HOST}"
        run: |
          $SSH_CMD "cd ${WP_PATH} && \
            wp core update-db --allow-root && \
            wp cache flush --allow-root && \
            wp plugin update --all --allow-root && \
            wp theme activate my-theme --allow-root"

      # ---- (Optional) Slack‑Benachrichtigung ----
      #- name: Notify Slack
      #  uses: slackapi/slack-github-action@v1.23.0
      #  with:
      #    payload: '{"text":"✅ Deploy von *main* nach *${{ secrets.DEPLOY_HOST }}* erfolgreich!"}'
      #  env:
      #    SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
