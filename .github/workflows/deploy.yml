name: Deploy WordPress to GoDaddy (debug)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: "1288419.eu15.myftpupload.com"
      SSH_USER:    "git_deployer_304faccb23_1288419"

    steps:
      - uses: actions/checkout@v4

      # ---------- Debug – speichere den Secret‑Key in eine temporäre Datei ----------
      - name: Write private key to temporary file (masked)
        env:
          PRIVATE_KEY_CONTENT: ${{ secrets.PRIVATE_KEY }}
        run: |
          echo "Creating /tmp/deploy_key …"
          printf "%s\n" "$PRIVATE_KEY_CONTENT" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          echo "File size (bytes): $(stat -c%s /tmp/deploy_key)"   # → sollte > 0 sein

      # ---------- Debug – teste die SSH‑Verbindung ----------
      - name: SSH connection test (dry‑run)
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/test_key
          chmod 600 ~/.ssh/test_key
          echo "Attempting SSH to ${SSH_USER}@${REMOTE_HOST} …"
          ssh -i ~/.ssh/test_key -o StrictHostKeyChecking=no -p 22 "${SSH_USER}@${REMOTE_HOST}" "echo 'SSH‑OK'" \
            && echo "✅ SSH succeeded" \
            || echo "❌ SSH failed (siehe vorherige Zeile)"
